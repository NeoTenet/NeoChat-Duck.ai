name: Build Neo AI Terminal for Windows (small EXE + portable bundle)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install lean build dependencies
        run: |
          python -m pip install --upgrade -r requirements-windows-exe.txt
          npm install --omit=dev --no-audit --no-fund

      - name: Build onedir application
        run: python -m PyInstaller --noconfirm --clean NeoAITerminal.spec

      - name: Stage Node runtime and npm modules
        shell: pwsh
        run: |
          $app = 'dist/Neo AI Terminal'
          New-Item -ItemType Directory -Force -Path "$app/node", "$app/data" | Out-Null
          Copy-Item (Get-Command node).Source "$app/node/node.exe" -Force
          Copy-Item 'node_modules' "$app/node_modules" -Recurse -Force
          Set-Content -Path "$app/portable.flag" -Value 'Neo AI Terminal portable mode'
          Copy-Item 'README_FA.md','LICENSE','THIRD_PARTY_NOTICES.md' -Destination $app -Force
          Compress-Archive -Path "$app/*" -DestinationPath 'dist/NeoAI-Terminal-Portable-Windows.zip' -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NeoAI-Terminal-Portable-Windows
          path: dist/NeoAI-Terminal-Portable-Windows.zip
          if-no-files-found: error
          retention-days: 30
